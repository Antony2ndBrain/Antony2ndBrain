<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Antony2ndBrain profile banner</title>
  <desc id="description">A blue and violet research-themed banner for Antony2ndBrain, featuring text about learning, NLP, and research</desc>
  <defs>
    <linearGradient id="background" x1="40" y1="20" x2="1160" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081A33"/>
      <stop offset="0.52" stop-color="#123D72"/>
      <stop offset="1" stop-color="#54268A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#63E6FF"/>
      <stop offset="1" stop-color="#B28DFF"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#background)"/>
  <circle cx="1030" cy="55" r="150" fill="#6E5AE6" fill-opacity="0.15"/>
  <circle cx="1120" cy="270" r="180" fill="#32C5FF" fill-opacity="0.10"/>
  <circle cx="82" cy="282" r="115" fill="#B28DFF" fill-opacity="0.10"/>

  <g opacity="0.9">
    <path d="M945 96L1013 57L1081 96V174L1013 213L945 174V96Z" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="1013" cy="135" r="25" stroke="#E9F7FF" stroke-width="3"/>
    <circle cx="1013" cy="135" r="7" fill="#63E6FF"/>
    <path d="M1013 110V82M1035 122L1060 108M1035 148L1060 162M1013 160V188M991 148L966 162M991 122L966 108" stroke="#B9EFFF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="1060" cy="108" r="5" fill="#B28DFF"/>
    <circle cx="1060" cy="162" r="5" fill="#63E6FF"/>
    <circle cx="966" cy="108" r="5" fill="#63E6FF"/>
    <circle cx="966" cy="162" r="5" fill="#B28DFF"/>
  </g>

  <circle cx="1013" cy="135" r="58" fill="#63E6FF" fill-opacity="0.12" filter="url(#softGlow)"/>

  <text x="80" y="118" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="700" letter-spacing="0.5">Antony2ndBrain</text>
  <text x="82" y="166" fill="#CDEBFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="500">Researching Indonesian NLP with care and curiosity</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600">
    <rect x="80" y="211" width="173" height="40" rx="20" fill="#63E6FF" fill-opacity="0.15" stroke="#63E6FF" stroke-opacity="0.5"/>
    <text x="107" y="237" fill="#DDF8FF">Learning</text>
    <rect x="270" y="211" width="143" height="40" rx="20" fill="#B28DFF" fill-opacity="0.15" stroke="#B28DFF" stroke-opacity="0.5"/>
    <text x="300" y="237" fill="#F0E8FF">NLP</text>
    <rect x="430" y="211" width="191" height="40" rx="20" fill="#63E6FF" fill-opacity="0.12" stroke="#63E6FF" stroke-opacity="0.45"/>
    <text x="456" y="237" fill="#DDF8FF">Research</text>
  </g>
